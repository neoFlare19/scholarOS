services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: scholaros-backend
    working_dir: /var/www
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/var/www
    networks:
      - scholaros
      - scholaros-db-net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: scholaros-frontend
    working_dir: /app
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: /api
    depends_on:
      - backend
    networks:
      - scholaros

volumes:
  frontend_node_modules:

networks:
  scholaros:
    driver: bridge
  scholaros-db-net:
    external: true
