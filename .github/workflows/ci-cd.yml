name: ScholarOS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: true

      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: scholaros_test
      DB_USERNAME: scholaros
      DB_PASSWORD: scholaros_password

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: scholaros_test
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: scholaros
          MYSQL_PASSWORD: scholaros_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, xml, ctype, curl, fileinfo, intl, pdo_mysql, zip
          coverage: none

      - name: Prepare Laravel directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/testing
          mkdir -p storage/framework/views
          mkdir -p storage/logs

          chmod -R 775 bootstrap/cache
          chmod -R 775 storage/framework
          chmod -R 775 storage/logs

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if php -r '
              $s = @fsockopen("127.0.0.1", 3306, $errno, $errstr, 2);
              exit($s ? 0 : 1);
            '; then
              echo "MySQL is ready"
              exit 0
            fi

            echo "Waiting for MySQL..."
            sleep 2
          done

          echo "MySQL did not become ready"
          exit 1

      - name: Run migrations
        run: php artisan migrate:fresh --force

      - name: Run Laravel tests
        run: php artisan test

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test --if-present

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy to production
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy source to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='backend/.env' \
            --exclude='backend/vendor/' \
            --exclude='backend/storage/' \
            --exclude='frontend/node_modules/' \
            --exclude='frontend/dist/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Rebuild and restart ScholarOS
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" << EOF

            set -e

            cd "${DEPLOY_PATH}"

            echo "Preparing Laravel runtime directories..."
            mkdir -p \
              backend/bootstrap/cache \
              backend/storage/framework/cache \
              backend/storage/framework/sessions \
              backend/storage/framework/testing \
              backend/storage/framework/views \
              backend/storage/logs

            echo "Building ScholarOS containers..."
            sudo -n docker compose build backend frontend

            echo "Starting ScholarOS containers..."
            sudo -n docker compose up -d backend frontend

            echo "Waiting for backend container..."
            for i in {1..30}; do
              if sudo -n docker inspect -f '{{.State.Running}}' scholaros-backend 2>/dev/null | grep -q true; then
                echo "Backend container is running"
                break
              fi

              if [ "\$i" -eq 30 ]; then
                echo "Backend container failed to start"
                sudo -n docker logs --tail=100 scholaros-backend || true
                exit 1
              fi

              sleep 2
            done

            echo "Running database migrations..."
            sudo -n docker exec scholaros-backend php artisan migrate --force

            echo "Clearing Laravel configuration cache..."
            sudo -n docker exec scholaros-backend php artisan config:clear

            echo "Checking backend..."
            curl -fsS http://127.0.0.1:8001/api/v1/ping

            echo "Checking frontend..."
            curl -fsSI http://127.0.0.1:5174/

            echo "ScholarOS deployment successful!"
          EOF
